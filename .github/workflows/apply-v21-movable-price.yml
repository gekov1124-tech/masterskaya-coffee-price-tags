name: Apply v21 movable price update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add movable price block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* v21 movable price runtime */'

          if marker not in text:
              css_patch = (
                  '.price-row{padding-left:31px;transform:translate(var(--dx,0px),var(--dy,0px))}'
                  '.price-row .move-handle{left:12px;top:50%}'
                  '.card-shell.vertical .price-row .move-handle{left:12px}'
                  '.price-input{min-width:72px}'
                  '.print-price{transform:translate(var(--price-dx,0mm),var(--price-dy,0mm))}'
                  + marker
              )
              text = text.replace('@page{size:A4 landscape;margin:5mm}', css_patch + '@page{size:A4 landscape;margin:5mm}', 1)

              runtime_patch = r'''
<script id="v21MovablePricePatch">
(() => {
  const originalCloneOffset = cloneOffset;
  cloneOffset = function(raw) {
    const result = originalCloneOffset(raw);
    result.price = {
      x: Number(raw?.price?.x) || 0,
      y: Number(raw?.price?.y) || 0
    };
    return result;
  };

  function ensurePriceOffsets(item) {
    for (const key of ["offsetH", "offsetV"]) {
      if (!item[key]) item[key] = cloneOffset();
      if (!item[key].price) item[key].price = {x: 0, y: 0};
    }
    return offset(item).price;
  }

  function enhancePriceHandles() {
    document.querySelectorAll(".card-shell").forEach(shell => {
      const item = items.find(candidate => candidate.id === shell.dataset.id);
      const row = shell.querySelector(".price-row");
      if (!item || !row) return;

      const position = ensurePriceOffsets(item);
      row.dataset.block = "price";
      row.style.setProperty("--dx", `${position.x}px`);
      row.style.setProperty("--dy", `${position.y}px`);

      if (!row.querySelector(".price-move-handle")) {
        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "move-handle price-move-handle";
        handle.dataset.block = "price";
        handle.textContent = "↕";
        handle.title = "Переместить цену";
        handle.setAttribute("aria-label", "Переместить цену");
        row.prepend(handle);
      }
    });
  }

  const originalRender = render;
  render = function(...args) {
    const result = originalRender(...args);
    requestAnimationFrame(enhancePriceHandles);
    return result;
  };

  const originalBuildPrintCard = buildPrintCard;
  buildPrintCard = function(item) {
    const position = ensurePriceOffsets(item);
    const card = originalBuildPrintCard(item);
    const price = card.querySelector(".print-price");
    if (price) {
      price.style.setProperty("--price-dx", `${position.x * .15}mm`);
      price.style.setProperty("--price-dy", `${position.y * .15}mm`);
    }
    return card;
  };

  items.forEach(ensurePriceOffsets);
  enhancePriceHandles();
  save();
})();
</script>
'''
              text = text.replace('</body>', runtime_patch + '</body>', 1)
              text = text.replace('редактор ценников v20', 'редактор ценников v21', 1)
              text = text.replace('Версия v20:', 'Версия v21:', 1)
              text = text.replace(
                  '<strong>Автоматическая компоновка:</strong>',
                  '<strong>Автоматическая компоновка:</strong> Цена редактируется нажатием, перемещается своей ручкой ↕, а размер меняется ползунком «Размер цены».',
                  1
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make price editable and movable in v21 [skip ci]'
          git push
