name: Deploy verified editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v30
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified v30 website
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('editor-v30.html').read_text(encoding='utf-8')
          source = source.replace(
              '<meta name="viewport" content="width=device-width,initial-scale=1">',
              '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
              '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
              '  <meta http-equiv="Pragma" content="no-cache">\n'
              '  <meta http-equiv="Expires" content="0">',
              1,
          )
          source = source.replace(
              '  </style>\n  <style id="pageStyle">',
              '    .release-badge{position:sticky;top:6px;z-index:60;width:max-content;margin:0 0 10px auto;padding:6px 10px;border-radius:999px;color:#fff;background:#7a3e08;font:800 .78rem var(--ui);box-shadow:0 5px 16px rgba(0,0,0,.16)}\n'
              '  </style>\n  <style id="pageStyle">',
              1,
          )
          source = source.replace(
              '<main class="app">',
              '<main class="app"><div class="release-badge">v30 · мобильное измерение исправлено</div>',
              1,
          )

          site = Path('_site')
          (site / 'v30').mkdir(parents=True, exist_ok=True)
          (site / 'index.html').write_text(source, encoding='utf-8')
          (site / 'v30' / 'index.html').write_text(source, encoding='utf-8')
          (site / 'version.txt').write_text('v30\n', encoding='utf-8')
          (site / '.nojekyll').touch()
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
